<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIVE MARKET — 미국 · 한국 주식 라이브 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #101114; color: #e9e9ec; color-scheme: dark; }
  body { font-family: 'IBM Plex Sans KR', system-ui, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 46px; z-index: 10; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #0b0c0e; border-bottom: 1px solid #24262b; }
  .brand { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; letter-spacing: 0.08em; white-space: nowrap; }
  .brand span { color: #8b8d95; font-weight: 500; font-size: 11px; letter-spacing: 0.04em; margin-left: 8px; }
  .tabs { display: flex; gap: 4px; background: #16171b; border: 1px solid #2c2f35; border-radius: 999px; padding: 3px; }
  .tabs button { font: inherit; font-size: 13px; font-weight: 600; color: #a3a5ad; background: transparent; border: 0; border-radius: 999px; padding: 6px 18px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: background .18s ease, color .18s ease; }
  .tabs button:hover { color: #e9e9ec; }
  .tabs button[aria-selected="true"] { background: #e9e9ec; color: #101114; }
  .tabs button .flag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; opacity: 0.7; }
  .hint { margin-left: auto; font-size: 11px; color: #6c6e76; white-space: nowrap; }
  .gear { font: inherit; width: 32px; height: 32px; border-radius: 999px; border: 1px solid #2c2f35; background: #16171b; color: #a3a5ad; cursor: pointer; font-size: 14px; }
  .gear:hover { background: #24272c; color: #e9e9ec; }
  .gear[aria-expanded="true"] { background: #e9e9ec; color: #101114; }
  .pop { position: fixed; top: 52px; right: 16px; z-index: 20; width: 360px; max-width: calc(100vw - 32px); background: #1b1d21; border: 1px solid #33363d; border-radius: 10px; padding: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: #b9bbc2; line-height: 1.5; }
  .pop[hidden] { display: none; }
  .pop h2 { margin: 0; font-size: 13px; color: #e9e9ec; }
  .pop form { display: flex; gap: 6px; }
  .pop input { flex: 1; min-width: 0; font: inherit; background: #15161a; color: #e9e9ec; border: 1px solid #2c2f35; border-radius: 6px; padding: 6px 10px; outline: none; }
  .pop input:focus { border-color: #4a4d55; }
  .pop button { font: inherit; font-weight: 600; background: #e9e9ec; color: #101114; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .pop .st { color: #6c6e76; }
  .pop a { color: #e9e9ec; text-decoration: underline; }
  .frame { position: fixed; top: 46px; left: 0; width: 100%; height: calc(100% - 46px); border: 0; background: #101114; }
  .frame[hidden] { display: none; }
  @media (max-width: 560px) { .hint { display: none; } .brand span { display: none; } .tabs button { padding: 6px 12px; } }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">LIVE MARKET<span>미국 · 한국 주식 라이브 보드</span></div>
    <div class="tabs" role="tablist" aria-label="보드 선택">
      <button type="button" role="tab" id="tab-us" aria-selected="true" aria-controls="f-us"><span class="flag">US</span>미국증시</button>
      <button type="button" role="tab" id="tab-kr" aria-selected="false" aria-controls="f-kr"><span class="flag">KR</span>한국증시</button>
    </div>
    <span class="hint">보드는 각각 독립적으로 갱신되며, 보고 있는 보드만 데이터를 받습니다</span>
    <button type="button" class="gear" id="gear" aria-label="데이터 설정" title="데이터 설정" aria-expanded="false" aria-controls="pop">⚙</button>
  </div>
  <div class="pop" id="pop" hidden>
    <h2>데이터 프록시 설정 (두 보드 공통)</h2>
    <span>네이버 금융·야후 등 외부 데이터는 r.jina.ai 프록시를 거쳐 받습니다. 키 없이는 분당 20회 제한이 있고, 네트워크에 따라 익명 요청이 차단되어 차트에 "시세를 받지 못함"이 뜰 수 있습니다. <a href="https://jina.ai/api-dashboard/" target="_blank" rel="noopener">jina.ai</a>에서 무료 API 키를 발급해 넣으면 제한 없이 바로 갱신됩니다.</span>
    <form id="keyform"><input id="keyin" placeholder="jina API 키 (jina_… 로 시작)" autocomplete="off"><button type="submit">저장</button></form>
    <span class="st" id="keyst"></span>
  </div>
  <iframe id="f-us" class="frame" title="미국 주식 라이브 보드" role="tabpanel"></iframe>
  <iframe id="f-kr" class="frame" title="한국 주식 라이브 보드" role="tabpanel" hidden></iframe>

  <script>
  (function () {
    var docs = { us: JSON.parse(document.getElementById('doc-us').textContent), kr: JSON.parse(document.getElementById('doc-kr').textContent) };
    var frames = { us: document.getElementById('f-us'), kr: document.getElementById('f-kr') };

    var mounted = {}, current = null;
    function tell(k) { try { frames[k].contentWindow.postMessage({ type: 'lm-visible', visible: current === k }, '*'); } catch (e) {} }
    Object.keys(frames).forEach(function (k) { frames[k].addEventListener('load', function () { tell(k); }); });
    function show(k) {
      if (!docs[k] || current === k) return;
      current = k;
      if (!mounted[k]) { mounted[k] = true; frames[k].srcdoc = docs[k]; }
      Object.keys(frames).forEach(function (j) {
        frames[j].hidden = j !== k;
        tabs[j].setAttribute('aria-selected', j === k ? 'true' : 'false');
        if (mounted[j]) tell(j);
      });
      document.title = titles[k];
      try { localStorage.setItem('lm_tab', k); } catch (e) {}
    }
    tabs.us.addEventListener('click', function () { show('us'); });
    tabs.kr.addEventListener('click', function () { show('kr'); });
    // 공용 API 키 설정 (두 보드가 같은 localStorage 키 lmkr_key 를 읽는다)
    var gear = document.getElementById('gear'), pop = document.getElementById('pop'), keyin = document.getElementById('keyin'), keyst = document.getElementById('keyst');
    function keyStatus() { var k = ''; try { k = (localStorage.getItem('lmkr_key') || '').trim(); } catch (e) {} keyst.textContent = k ? '키가 설정되어 있습니다 (빠른 갱신 모드). 키는 이 브라우저에만 저장됩니다.' : '키 없음 · 분당 20회 제한 모드'; return k; }
    gear.addEventListener('click', function () { var open = pop.hidden; pop.hidden = !open; gear.setAttribute('aria-expanded', open ? 'true' : 'false'); if (open) { keyin.value = keyStatus(); keyin.focus(); } });
    document.getElementById('keyform').addEventListener('submit', function (e) { e.preventDefault(); var v = keyin.value.trim(); try { if (v) localStorage.setItem('lmkr_key', v); else localStorage.removeItem('lmkr_key'); } catch (x) {} keyStatus(); keyst.textContent = (v ? '저장했습니다. ' : '키를 지웠습니다. ') + keyst.textContent; Object.keys(frames).forEach(function (k) { if (mounted[k]) { try { frames[k].contentWindow.postMessage({ type: 'lm-visible', visible: current === k }, '*'); } catch (x) {} } }); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) { pop.hidden = true; gear.setAttribute('aria-expanded', 'false'); } });
    var start = 'us';
    try { var v = localStorage.getItem('lm_tab'); if (v === 'kr' || v === 'us') start = v; } catch (e) {}
    show(start);
  })();
  </script>
</body>
